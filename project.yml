name: SwiftReader
options:
  bundleIdPrefix: com.sjzcook
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SwiftReader:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/SwiftReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjzcook.swiftreader
        INFOPLIST_KEY_CFBundleDisplayName: SwiftReader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
